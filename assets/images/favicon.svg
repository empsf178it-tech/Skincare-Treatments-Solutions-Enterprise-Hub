<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B67" />
      <stop offset="100%" stop-color="#0F4F4C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Brand Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- DNA Helix Emblem -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 19 15 C 27 26, 37 38, 45 49" />
    <path d="M 45 15 C 37 26, 27 38, 19 49" />
    <line x1="22" y1="20" x2="42" y2="20" stroke-width="4" />
    <line x1="25" y1="27" x2="39" y2="27" stroke-width="3.5" />
    <line x1="29" y1="32" x2="35" y2="32" stroke-width="3.5" />
    <line x1="25" y1="37" x2="39" y2="37" stroke-width="3.5" />
    <line x1="22" y1="44" x2="42" y2="44" stroke-width="4" />
  </g>
</svg>
